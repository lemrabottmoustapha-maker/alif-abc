name: Build apps

# Runs by itself every time files are pushed, and can also be started by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    # Pinned: this image already contains the Android SDK, so no separate SDK installer is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web app into the Android project
        run: sh tools/sync.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: alif-abc-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web app into the desktop project
        shell: bash
        run: sh tools/sync.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build programs
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: alif-abc-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
