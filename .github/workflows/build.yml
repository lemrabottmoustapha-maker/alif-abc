name: Build apps

# Runs by itself every time files are pushed, and can also be started by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # Pinned: this image already contains the Android SDK, so no separate SDK installer is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web app into the Android project
        run: sh tools/sync.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: alif-abc-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish the update (for the in-app update check)
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alif-abc-android-apk
          path: out
      - name: Publish alif-abc.apk and version.json to the "latest" release
        run: |
          code=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          name=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          mv out/app-debug.apk out/alif-abc.apk
          printf '{"versionCode":%s,"versionName":"%s"}' "$code" "$name" > out/version.json
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest" --notes "Newest Android build. Install alif-abc.apk." --target "$GITHUB_SHA"
          gh release upload latest out/alif-abc.apk out/version.json --clobber
          gh release edit latest --title "Latest ($name)"

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web app into the desktop project
        shell: bash
        run: sh tools/sync.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build programs
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: alif-abc-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
