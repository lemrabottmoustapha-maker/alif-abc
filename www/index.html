<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألف ABC</title>
<meta name="description" content="تطبيق تعليمي للأطفال: الحروف والقراءة والكتابة والحساب والألعاب بالعربية والفرنسية والإنجليزية، ودروس إسلامية.">
<meta name="theme-color" content="#EAF3FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1630" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ألف ABC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: sticky header (brand, language, stars), one scrolling view, fixed bottom tab bar. Chunky tiles and buttons sized for small fingers. */
:root{
  --bg:#EAF3FF; --surface:#FFFFFF; --ink:#13203F; --muted:#4A5B80; --line:#C5D3EE;
  --brand:#2F5BFF; --brand-ink:#FFFFFF; --brand-edge:#1B3CB8;
  --sun-bg:#FFE7A0; --sun:#8F5300;
  --coral-bg:#FFD6CF; --coral:#B82E1B;
  --teal-bg:#C6F1EA; --teal:#0A6A61;
  --blue-bg:#D5E1FF; --blue:#1F42BF;
  --good:#12803A; --good-bg:#D3F5DF; --bad:#C42E2E; --bad-bg:#FFDADA;
  --ghost:#B9C8EA; --brush:#2F5BFF; --star:#F5A400; --scrim:rgba(10,18,40,.55);
  --display:"Baloo 2","Baloo Bhaijaan 2",system-ui,sans-serif;
  --body:"Nunito","Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1630; --surface:#18244A; --ink:#EEF3FF; --muted:#A9B8DD; --line:#2C3C6E;
  --brand:#7C9BFF; --brand-ink:#0E1630; --brand-edge:#4863C6;
  --sun-bg:#4A3A0E; --sun:#FFCB5C; --coral-bg:#4D2220; --coral:#FF9A8B;
  --teal-bg:#103F3B; --teal:#5FE0D0; --blue-bg:#1E2F6B; --blue:#9DB6FF;
  --good:#5CE08A; --good-bg:#12432A; --bad:#FF8A8A; --bad-bg:#4A1E24;
  --ghost:#33467C; --brush:#FFCB5C; --star:#FFC933; --scrim:rgba(0,0,0,.65);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#18244A; --ink:#EEF3FF; --muted:#A9B8DD; --line:#2C3C6E;
  --brand:#7C9BFF; --brand-ink:#0E1630; --brand-edge:#4863C6;
  --sun-bg:#4A3A0E; --sun:#FFCB5C; --coral-bg:#4D2220; --coral:#FF9A8B;
  --teal-bg:#103F3B; --teal:#5FE0D0; --blue-bg:#1E2F6B; --blue:#9DB6FF;
  --good:#5CE08A; --good-bg:#12432A; --bad:#FF8A8A; --bad-bg:#4A1E24;
  --ghost:#33467C; --brush:#FFCB5C; --star:#FFC933; --scrim:rgba(0,0,0,.65);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 1rem/1.5 var(--body);
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app.l-ar{--display:"Baloo Bhaijaan 2","Baloo 2",system-ui,sans-serif;--body:"Cairo","Nunito",system-ui,sans-serif}
#app{max-width:760px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand-text{direction:ltr;display:flex;gap:6px;align-items:baseline;font:800 1.55rem/1 var(--display);margin:0}
.brand-text .abc{color:var(--brand)}
.langs{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:3px;order:3;width:100%}
.langs button{flex:1;border:0;background:transparent;border-radius:12px;min-height:44px;font-weight:800;padding:0 8px}
.langs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;min-height:44px;padding:0 14px;font:800 1.1rem var(--display);font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px;fill:var(--star)}
.chip.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.2)}}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:560px){.langs{order:0;width:auto}.langs button{padding:0 16px}}

/* generic */
.view{display:flex;flex-direction:column;gap:16px;padding-top:6px}
h2{font:800 1.35rem/1.2 var(--display);margin:0;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:44px;padding:0 16px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:16px;min-height:50px;padding:0 20px;font:800 1.05rem var(--display);
  box-shadow:0 4px 0 var(--brand-edge);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-edge)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}

/* letters */
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;min-width:0}
.prog span{white-space:nowrap;font-weight:800;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1;border:0;border-radius:20px;background:var(--tb);color:var(--tc);
  font:800 2.1rem/1 var(--display);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 40%,transparent);padding:0;min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 40%,transparent)}
.l-ar .tile{font-size:2.5rem}
.tile .dot{position:absolute;top:8px;inset-inline-end:8px;width:12px;height:12px;border-radius:50%;background:var(--tc)}
.c0{--tb:var(--sun-bg);--tc:var(--sun)}.c1{--tb:var(--coral-bg);--tc:var(--coral)}
.c2{--tb:var(--teal-bg);--tc:var(--teal)}.c3{--tb:var(--blue-bg);--tc:var(--blue)}

/* overlay */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:28px;width:min(100%,460px);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bigletter{display:grid;place-items:center;border-radius:24px;background:var(--tb);color:var(--tc);padding:14px 10px;gap:2px;text-align:center}
.bigletter .g{font:800 6.5rem/1.1 var(--display)}
.l-ar .bigletter .g{font-size:7.5rem}
.bigletter .nm{font:800 1.4rem var(--display)}
.forms{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.form{background:var(--bg);border-radius:14px;padding:6px 12px;text-align:center;min-width:72px}
.form b{display:block;font:800 2rem/1.3 var(--display)}
.form small{color:var(--muted);font-weight:700}
.pic{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:12px 16px}
.pic .em{font-size:3.6rem;line-height:1}
.pic .wd{font:800 1.9rem/1.2 var(--display);overflow-wrap:anywhere}
.hl{color:var(--tc)}
.nav2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.arrow svg{transform:none}
#app[dir="rtl"] .arrow svg{transform:scaleX(-1)}

/* reading text */
.textcard{align-items:stretch;text-align:start;gap:10px}
.textcard .ttl{text-align:center;margin:0;font-size:1.7rem}
.sents{display:flex;flex-direction:column;gap:8px}
.sent{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:10px 14px;text-align:start;font:800 1.9rem/1.7 var(--display);color:var(--ink);overflow-wrap:anywhere}
.sent:active{background:var(--surface)}
#app.l-ar .sent{font-family:"Amiri","Cairo",serif;font-weight:700;font-size:2.1rem;line-height:2.1}
#app.l-ar .textcard .ttl,#app.l-ar .textcard+.card h2{font-family:"Amiri","Cairo",serif;line-height:2}

/* picture of the answer */
.ansPic{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--good-bg);border:2px solid var(--good);border-radius:20px;padding:10px 16px;width:100%}
.ansPic .pem{font-size:4.2rem;line-height:1}
.ansPic .psvg{width:84px;height:68px}
.ansPic b{font:800 1.5rem/1.3 var(--display);color:var(--good)}

/* quiz */
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.card .em{font-size:6rem;line-height:1.1}
.card .wd{font:800 2.2rem/1.2 var(--display)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:18px;min-height:64px;padding:8px 12px;font:800 1.6rem/1.2 var(--display);
  box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:none;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:34px;font:800 1.3rem var(--display);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}

/* math */
.eq{direction:ltr;font:800 3rem/1.1 var(--display);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.eq .q{color:var(--brand)}
.emo{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:2rem;line-height:1.15;max-width:100%}
.emo.small{font-size:1.6rem}
.emo .gone{opacity:.22;filter:grayscale(1)}
.group{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;direction:ltr}
.group .gb{background:var(--bg);border-radius:16px;padding:8px 10px;max-width:100%}
.lvl{display:flex;gap:6px;align-items:center;font-weight:800;color:var(--muted)}
.lvl i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--star)}

/* writing */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.strip button{flex:0 0 auto;min-width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 1.5rem/1 var(--display);padding:0 8px;position:relative}
.strip button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.strip button.wr::after{content:"";position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.pad{position:relative;width:min(100%,440px,max(240px,calc(100dvh - 520px)));aspect-ratio:1;margin-inline:auto;background:var(--surface);border:2px solid var(--line);border-radius:24px;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
#ink{touch-action:none;cursor:crosshair}

/* bottom tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:transparent;border-radius:16px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:800 .74rem/1.1 var(--display);color:var(--muted);padding:4px 1px;min-width:0}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs svg text{fill:currentColor;stroke:none;font:800 15px var(--display)}
.tabs button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}


/* islamic lessons (Arabic only) */
.ar-scope{--display:"Cairo","Baloo Bhaijaan 2",system-ui,sans-serif;--body:"Cairo","Nunito",system-ui,sans-serif;direction:rtl;font-family:var(--body)}
.isl{display:flex;flex-direction:column;gap:16px}
.isl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lesson{position:relative;border:0;border-radius:20px;background:var(--tb);color:var(--tc);padding:14px 12px;min-height:104px;text-align:start;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 40%,transparent);min-width:0}
.lesson:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 40%,transparent)}
.lesson b{font:700 1.2rem/1.8 var(--display)}
.lesson small{font-weight:700;font-size:.92rem;line-height:1.9}
.lesson .dn{position:absolute;top:10px;inset-inline-end:10px;width:26px;height:26px;border-radius:50%;background:var(--tc);display:grid;place-items:center}
.lesson .dn svg{width:15px;height:15px;stroke:var(--tb);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.reader{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ayah{display:block;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);text-align:start;padding:6px 0;
  font-family:"Amiri Quran","Amiri","Cairo",serif;font-size:1.8rem;line-height:2.15;color:var(--ink);overflow-wrap:anywhere}
.ayah:last-child{border-bottom:0}
.ayah.veil .txt{filter:blur(9px);user-select:none}
.ayn{display:inline-grid;place-items:center;min-width:2rem;height:2rem;border-radius:50%;border:2px solid var(--tc);color:var(--tc);
  font:700 1rem/1 var(--body);margin-inline-start:8px;vertical-align:middle}
.bsm{font-family:"Amiri Quran","Amiri","Cairo",serif;font-size:1.6rem;line-height:2;text-align:center;color:var(--tc);margin:0}
.hprefix{margin:0;font:700 1.25rem/1.8 "Amiri","Cairo",serif;color:var(--muted)}
.htext{margin:0;font:700 1.9rem/2.1 "Amiri","Amiri Quran","Cairo",serif;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.meta span{background:var(--bg);border-radius:12px;padding:4px 12px;font-weight:800;font-size:.95rem;line-height:1.7}
.gist{background:var(--bg);border-radius:18px;padding:12px 16px;font-weight:700;line-height:2.2}
.gist h3{margin:0;font:800 1.05rem/1.6 var(--display);color:var(--tc)}
.para{margin:0;font-family:"Amiri","Cairo",serif;font-weight:700;font-size:1.4rem;line-height:2.4}
.qtext{font-family:"Amiri Quran","Amiri","Cairo",serif;font-size:1.9rem;line-height:2.1;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4.5rem;border-bottom:4px solid var(--brand)}
.isl{line-height:1.9}
.isl h2{line-height:1.9}
.isl .opt{font-family:var(--body);font-weight:700;font-size:1.3rem;line-height:1.9}
.opt.qf{font-family:"Amiri Quran","Amiri","Cairo",serif;font-size:1.6rem;line-height:1.8}


/* islamic groups, long hadith */
.lessons .grp{grid-column:1/-1;margin:10px 0 0;font:800 1.15rem/1.8 var(--display);color:var(--tc)}
.lessons .grp small{color:var(--muted);font-weight:700;font-size:.9rem}
.htext.long{font-size:1.5rem;line-height:2.2}.htext.xl{font-size:1.3rem;line-height:2.2}
.hprefix{overflow-wrap:anywhere}

/* games */
.ghub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gt{border:0;border-radius:22px;background:var(--tb);color:var(--tc);padding:14px;min-height:150px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 40%,transparent);min-width:0}
.gt:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 40%,transparent)}
.gt .gl{width:56px;height:56px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font:800 2rem/1 var(--display);color:var(--tc)}
.gt b{font:800 1.15rem/1.3 var(--display)}
.gt small{font-weight:700;font-size:.92rem;line-height:1.4}
.qline{font:800 1.5rem/1.6 var(--display);margin:0;overflow-wrap:anywhere}
.fact{background:var(--bg);border-radius:16px;padding:10px 14px;font-weight:700;text-align:start;width:100%;line-height:1.7}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px}
.mem.s32{grid-template-columns:repeat(8,1fr);gap:5px;max-width:100%}
.mem.s32 .mc{font-size:1.45rem;border-radius:10px}.mem.s32 .mc .back{font-size:1.1rem}
.scorebar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font:800 1.15rem var(--display)}
.scorebar span{background:var(--bg);border-radius:14px;padding:6px 14px;border:2px solid transparent}
.scorebar span.act{border-color:var(--brand);color:var(--brand)}
.mc{aspect-ratio:1;border:0;border-radius:18px;background:var(--brand);color:var(--brand-ink);font-size:2.3rem;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--brand-edge);min-width:0}
.mc .back{font:800 1.8rem/1 var(--display)}
.mc.up{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.mc.ok{background:var(--good-bg);border:2px solid var(--good);box-shadow:none}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:60px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;font:800 2rem/1 var(--display);background:var(--bg)}
.slot.f{border-style:solid;border-color:var(--brand);background:var(--surface)}
.ltile{min-width:54px;height:62px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font:800 2rem/1 var(--display);padding:0 8px;box-shadow:0 4px 0 var(--line)}
.ltile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ltile:disabled{opacity:.3;box-shadow:none}
.seq{direction:ltr;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.seq .qm{width:58px;height:58px;border-radius:14px;border:3px dashed var(--brand);color:var(--brand);display:grid;place-items:center}
.opt.big{font-size:2.4rem;min-height:78px}

.panel-h{font:800 1.05rem/1.4 var(--display);margin:0}
.fine{margin:0;color:var(--muted);font-weight:700;font-size:.9rem;line-height:1.6}
.danger{color:var(--bad);border-color:var(--bad)}

  if(o&&LANG[o.lang])S.lang=o.lang;

  if(o&&o.learned)['ar','fr','en'].forEach(function(k){if(Array.isArray(o.learned[k]))S.learned[k]=o.learned[k]});
  if(o&&o.written)['ar','fr','en','d'].forEach(function(k){if(Array.isArray(o.written[k]))S.written[k]=o.written[k]});
  if(o&&o.mlevel>=1&&o.mlevel<=3)S.mlevel=o.mlevel;
  if(o&&o.sound===false)S.sound=false;if(o&&Array.isArray(o.islam))S.islam=o.islam;
  if(o&&o.streak&&typeof o.streak.n==='number')S.streak={last:String(o.streak.last||''),n:o.streak.n,best:o.streak.best||o.streak.n};
  if(o&&o.stats)S.stats={mem:+o.stats.mem||0,math:+o.stats.math||0};
  if(o&&Array.isArray(o.badges))S.badges=o.badges}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,stars:S.stars,learned:S.learned,written:S.written,mlevel:S.mlevel,sound:S.sound,islam:S.islam,streak:S.streak,stats:S.stats,badges:S.badges}))}catch(e){}}
var t=function(){return T[S.lang]};
var items=function(){return DATA[S.lang]};

/* ---------- sound ---------- */
var actx=null;
function tone(seq){
  if(!S.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended'&&actx.resume)actx.resume();
    var now=actx.currentTime;
    seq.forEach(function(n,i){var o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=n[0];o.connect(g);g.connect(actx.destination);
      var st=now+i*0.12;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.18,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+n[1]);o.start(st);o.stop(st+n[1]+0.05)})}catch(e){}
}
var chime=function(){tone([[660,.18],[880,.18],[1175,.3]])};
var thud=function(){tone([[220,.2]])};
var ttsWarned=false;
var TTS_MISSING={
  ar:'لا يوجد صوت لهذه اللغة في هاتفك. ثبّت صوتها من إعدادات «تحويل النص إلى كلام».',
  fr:'Aucune voix pour cette langue sur ton téléphone. Installe-la dans les réglages « Synthèse vocale ».',
  en:'No voice for this language on your phone. Install it in the “Text-to-speech” settings.'
};
window.__ttsMissing=function(){if(ttsWarned)return;ttsWarned=true;toast(TTS_MISSING[S.lang])};
function stopSpeech(){
  try{if(window.AndroidTTS)window.AndroidTTS.stop();else if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(_){}
}
function bestVoice(code){
  var pre=code.slice(0,2),vs=[];try{vs=window.speechSynthesis.getVoices()}catch(_){}
  var best=null,bs=-1;
  vs.forEach(function(v){var l=(v.lang||'').toLowerCase().replace('_','-');if(l.indexOf(pre)!==0)return;
    var sc=0,n=(v.name||'').toLowerCase();
    if(l===code.toLowerCase())sc+=4;
    if(/natural|neural|online|google|enhanced|premium|siri|hoda|naayf|zariyah|salma|shakir|hamed/.test(n))sc+=3;
    if(v.localService)sc+=1;
    if(sc>bs){bs=sc;best=v}});
  return best}
var RATE={ar:0.8,fr:0.85,en:0.85};
function speak(text,queue){
  if(!S.sound)return;
  text=String(text);if(S.lang==='ar'&&SAYAR[text])text=SAYAR[text];
  if(window.AndroidTTS){try{window.AndroidTTS.speak(text,LANG[S.lang].code,!!queue,RATE[S.lang])}catch(_){}return}
  if(!('speechSynthesis' in window))return;
  try{var syn=window.speechSynthesis;if(!queue)syn.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=LANG[S.lang].code;u.rate=RATE[S.lang];u.pitch=1;
    var v=bestVoice(LANG[S.lang].code);if(v)u.voice=v;
    syn.speak(u)}catch(e){}
}

/* ---------- history: go back to the previous word / puzzle ---------- */
var HIST={};
function hAdd(k,o){var h=HIST[k]||(HIST[k]={l:[],i:-1});h.l.length=h.i+1;h.l.push(o);if(h.l.length>40)h.l.shift();h.i=h.l.length-1}
function hCan(k){var h=HIST[k];return !!h&&h.i>0}

function hFwd(k){var h=HIST[k];if(!h||h.i>=h.l.length-1)return null;h.i++;return h.l[h.i]}

/* ---------- reading ---------- */
var R={mode:'word',q:null,last:-1,ti:0,tq:null};
function newRead(){
  var L=items(),i;do{i=rand(L.length)}while(i===R.last&&L.length>1);R.last=i;
  var it=L[i],opts;
  if(R.mode==='word'){
    var o=[i];while(o.length<3){var k=rand(L.length);if(o.indexOf(k)<0)o.push(k)}
    opts=shuffle(o).map(function(k){return {key:k,label:L[k].w,ok:k===i,lang:S.lang}});
  }else{
    var o2=[i];while(o2.length<4){var k2=rand(L.length);if(o2.indexOf(k2)<0)o2.push(k2)}
    opts=shuffle(o2).map(function(k){return {key:k,label:S.lang==='ar'?L[k].l:L[k].l,ok:k===i}});
  }
  R.q={i:i,opts:opts,done:false,wrong:[],msg:null,mode:R.mode};hAdd('read',R.q);
}
function newTextQ(){var tx=TEXTS[S.lang][R.ti],q=tx.q;R.tq={opts:shuffle(q.slice(1)),done:false,wrong:[],msg:''}}
function viewText(seg){

   '<div class="card"><h2>'+esc(tx.q[0])+'</h2><div class="opts" role="group" lang="'+S.lang+'">'+opts+'</div>'+fb+'</div>'+
   '<div class="nav2"><button class="btn ghost arrow" data-act="tprev" aria-label="'+esc(t().prev)+'">'+ICON.chev+'<span>'+esc(t().prev)+'</span></button><button class="btn ghost arrow" data-act="tnext" aria-label="'+esc(t().next)+'"><span>'+esc(t().next)+'</span><span style="display:inline-flex;transform:scaleX(-1)">'+ICON.chev+'</span></button></div>';

  if(q.opts[k]===ans){q.done=true;q.msg=pick(t().good);addStar(1);chime();speak(ans)}else{q.wrong.push(k);thud()}renderView()}

/* ---------- writing ---------- */
var W={kind:'letters',cap:'upper',idx:0};
var PAD={size:0,len:0};
function wChars(){return W.kind==='digits'?'0123456789'.split(''):items().map(function(x){return x.l})}
function wGlyph(c){return(W.kind==='digits'||S.lang==='ar')?c:(W.cap==='lower'?c.toLowerCase():c)}
function wKey(){return W.kind==='digits'?'d':S.lang}

   (latin?'<div class="seg" role="group"><button data-act="wcap" data-v="upper" aria-pressed="'+(W.cap==='upper')+'">'+esc(t().upper)+'</button><button data-act="wcap" data-v="lower" aria-pressed="'+(W.cap==='lower')+'">'+esc(t().lower)+'</button></div>':'')+'</div>'+
  strip+'<p class="hint" style="text-align:center;margin:0">'+esc(t().trace)+'</p>'+
  '<div class="pad" id="pad"><canvas id="ghost" aria-hidden="true"></canvas><canvas id="ink" role="img" aria-label="'+esc(t().trace)+'"></canvas></div>'+
  '<div class="row center tight"><button class="btn ghost" data-act="wclear">'+ICON.eraser+'<span>'+esc(t().clear)+'</span></button><button class="btn ghost" data-act="whear">'+ICON.spk+'<span>'+esc(t().hear)+'</span></button><button class="btn" data-act="wdone">'+ICON.chk+'<span>'+esc(t().done)+'</span></button></div>';
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
function ghostFont(size){return S.lang==='ar'&&W.kind==='letters'?'700 '+Math.round(size*0.66)+'px "Baloo Bhaijaan 2",Cairo,sans-serif':'800 '+Math.round(size*0.8)+'px "Baloo 2",Nunito,sans-serif'}
function drawGhost(){
  var c=$('#ghost');if(!c||!PAD.size)return;var ctx=c.getContext('2d'),s=PAD.size;
  var ch=wGlyph(wChars()[W.idx]);ctx.clearRect(0,0,s,s);
  ctx.font=ghostFont(s);ctx.fillStyle=cssv('--ghost');ctx.textAlign='center';ctx.textBaseline='alphabetic';
  var m=ctx.measureText(ch),asc=m.actualBoundingBoxAscent||s*0.3,desc=m.actualBoundingBoxDescent||0;
  ctx.fillText(ch,s/2,s/2+(asc-desc)/2);
}
function mountPad(){
  var wrap=$('#pad');if(!wrap)return;
  var size=Math.round(wrap.getBoundingClientRect().width);
  if(size<10){requestAnimationFrame(mountPad);return}
  var dpr=Math.min(window.devicePixelRatio||1,2);
  ['ghost','ink'].forEach(function(id){var c=$('#'+id);c.width=c.height=Math.round(size*dpr);c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)});
  PAD.size=size;PAD.len=0;drawGhost();
  var f=ghostFont(size),ch=wGlyph(wChars()[W.idx]);
  if(document.fonts&&document.fonts.load){document.fonts.load(f,ch).then(drawGhost).catch(function(){})}
  var ink=$('#ink'),ctx=ink.getContext('2d'),drawing=false,last=null;
  function pos(e){var r=ink.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function style(){ctx.strokeStyle=cssv('--brush');ctx.fillStyle=cssv('--brush');ctx.lineWidth=PAD.size*0.07;ctx.lineCap='round';ctx.lineJoin='round'}
  ink.addEventListener('pointerdown',function(e){drawing=true;try{ink.setPointerCapture(e.pointerId)}catch(_){}
    last=pos(e);style();ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,6.283);ctx.fill();e.preventDefault()});
  ink.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);style();
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    PAD.len+=Math.hypot(p.x-last.x,p.y-last.y);last=p;e.preventDefault()});
  var end=function(){drawing=false};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);ink.addEventListener('pointerleave',end);
  var cur=$('#strip button[aria-pressed="true"]');if(cur&&cur.scrollIntoView){try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(_){}}
}
function clearInk(){var c=$('#ink');if(!c)return;var ctx=c.getContext('2d');ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore();PAD.len=0}
/* how well the child's tracing matches the letter: min(share of the letter covered, share of the ink lying on the letter) */
var MATCH_MIN=0.6;
function dil(a,n,r){var o=new Uint8Array(n*n),tmp=new Uint8Array(n*n),x,y,k;
  for(y=0;y<n;y++)for(x=0;x<n;x++){if(a[y*n+x]){var x0=Math.max(0,x-r),x1=Math.min(n-1,x+r);for(k=x0;k<=x1;k++)tmp[y*n+k]=1}}
  for(y=0;y<n;y++)for(x=0;x<n;x++){if(tmp[y*n+x]){var y0=Math.max(0,y-r),y1=Math.min(n-1,y+r);for(k=y0;k<=y1;k++)o[k*n+x]=1}}
  return o}
function matchScore(){
  var g=$('#ghost'),ink=$('#ink');if(!g||!ink)return 0;
  var N=64,c=document.createElement('canvas');c.width=c.height=N;var cx=c.getContext('2d');
  function mask(src,th){cx.clearRect(0,0,N,N);cx.drawImage(src,0,0,N,N);var d=cx.getImageData(0,0,N,N).data,m=new Uint8Array(N*N);for(var i=0;i<N*N;i++)m[i]=d[i*4+3]>th?1:0;return m}
  var G=mask(g,30),I=mask(ink,30),r=4,Gd=dil(G,N,r),Id=dil(I,N,r),gs=0,gc=0,is=0,ic=0,i;
  for(i=0;i<N*N;i++){if(G[i]){gs++;if(Id[i])gc++}if(I[i]){is++;if(Gd[i])ic++}}
  if(!gs||!is)return 0;
  return Math.min(gc/gs,ic/is)}
function writeDone(){
  if(PAD.len<PAD.size*0.3){toast(t().traceFirst);return}

  var k=wKey(),w=S.written[k];if(w.indexOf(W.idx)<0)w.push(W.idx);
  addStar(1);chime();toast(pick(t().good)+' '+sc+'%');

var M={mode:'add',q:null};
var MAXL=[5,10,20];
function mkOpts(c,lo,hi){var s=[c],g=0;while(s.length<4&&g++<80){var d=c+rand(7)-3;if(d>=lo&&d<=hi&&s.indexOf(d)<0)s.push(d)}
  var x=lo;while(s.length<4&&x<=hi){if(s.indexOf(x)<0)s.push(x);x++}return shuffle(s)}
function newMath(){
  var max=MAXL[S.mlevel-1],q;
  if(M.mode==='count'){var cap=Math.min(max,15),n=1+rand(cap);q={type:'count',n:n,emo:pick(COUNT_EMOJI),ans:n,opts:mkOpts(n,1,Math.max(n+3,5))}}
  else if(M.mode==='add'){var a=1+rand(max-1),b=1+rand(max-a);q={type:'add',a:a,b:b,emo:pick(COUNT_EMOJI),ans:a+b,opts:mkOpts(a+b,0,max)}}
  else{var a2=2+rand(max-1),b2=1+rand(a2-1);q={type:'sub',a:a2,b:b2,emo:pick(COUNT_EMOJI),ans:a2-b2,opts:mkOpts(a2-b2,0,max)}}
  q.done=false;q.wrong=[];M.q=q;
}
function emos(e,n,gone,small){var h='';for(var i=0;i<n;i++)h+='<span'+(i>=n-gone?' class="gone"':'')+'>'+e+'</span>';return '<div class="emo'+(small?' small':'')+'" aria-hidden="true">'+h+'</div>'}
function viewMath(){
  if(!M.q||M.q.type!==M.mode)newMath();
  var q=M.q,eq='',vis='',ask=t().whatIs,ans=q.done?'<span class="q" style="color:var(--good)">'+q.ans+'</span>':'<span class="q">?</span>';
  if(q.type==='count'){ask=t().howMany;vis=emos(q.emo,q.n,0,false);eq=''}
  else if(q.type==='add'){eq='<div class="eq" dir="ltr"><span>'+q.a+'</span><span>+</span><span>'+q.b+'</span><span>=</span>'+ans+'</div>';
    vis=(q.a+q.b<=20)?'<div class="group"><div class="gb">'+emos(q.emo,q.a,0,true)+'</div><div class="gb">'+emos(q.emo,q.b,0,true)+'</div></div>':''}
  else{eq='<div class="eq" dir="ltr"><span>'+q.a+'</span><span>−</span><span>'+q.b+'</span><span>=</span>'+ans+'</div>';
    vis='<div class="gb" style="background:var(--bg);border-radius:16px;padding:8px 10px">'+emos(q.emo,q.a,q.b,true)+'</div>'}
  var lv='<div class="lvl"><span>'+esc(t().level)+'</span>'+[1,2,3].map(function(n){return '<i class="'+(n<=S.mlevel?'on':'')+'"></i>'}).join('')+'</div>';
  var msg=q.done?'<div class="fb good" aria-live="polite">'+esc(q.msg)+'<button class="btn" data-act="mnext"><span>'+esc(t().next)+'</span></button></div>'
    :(q.wrong.length?'<div class="fb bad" aria-live="polite">'+esc(t().retry)+'</div>':'<div class="fb"></div>');
  return '<div class="row" style="justify-content:space-between"><div class="seg" role="group">'+
   [['count',t().mCount],['add',t().mAdd],['sub',t().mSub]].map(function(m){return '<button data-act="mmode" data-v="'+m[0]+'" aria-pressed="'+(M.mode===m[0])+'">'+esc(m[1])+'</button>'}).join('')+'</div>'+lv+'</div>'+
  '<div class="card"><h2>'+esc(ask)+'</h2>'+eq+vis+
  '<button class="btn ghost" data-act="mhear">'+ICON.spk+'<span>'+esc(t().hear)+'</span></button>'+
  '<div class="opts" role="group">'+q.opts.map(function(o){
    var cls='opt'+(q.done&&o===q.ans?' ok':'')+(q.wrong.indexOf(o)>=0?' no':'');
    return '<button class="'+cls+'" data-act="mopt" data-v="'+o+'"'+(q.done||q.wrong.indexOf(o)>=0?' disabled':'')+' style="direction:ltr">'+o+'</button>'}).join('')+'</div>'+msg+'</div>';
}
function mathSay(){
  var q=M.q;if(!q)return;
  if(q.type==='count')speak(t().howMany);
  else if(q.type==='add')speak(q.a+' '+t().plus+' '+q.b+' '+t().equals);
  else speak(q.a+' '+t().minus+' '+q.b+' '+t().equals);
}
function mathPick(v){
  var q=M.q;if(!q||q.done)return;
  if(v===q.ans){q.done=true;q.msg=pick(t().good);S.stats.math++;addStar(1);chime();
    S.mstreak++;
    if(S.mstreak>=5&&S.mlevel<3){S.mlevel++;S.mstreak=0;toast(t().levelUp)}
    save();speak(String(q.ans))}
  else{q.wrong.push(v);S.mstreak=0;thud()}
  renderView();
}

var POOL=[];
(function(){function lw(t){var w=t.trim().split(/\s+/);return w[w.length-1]}
  QURAN.forEach(function(s){s.ayat.forEach(function(a){POOL.push(lw(a))})});HADITH.forEach(function(h){POOL.push(lw(h.text.replace(/[.،»]+$/,'')))})})();
function blankQ(text,clause){
  if(clause){var cl=text.split(/[،.؛:؟!«»]/).map(function(x){return x.trim()}).filter(function(x){return x.split(/\s+/).length>=3});if(cl.length)text=pick(cl)}
  var w=text.trim().split(/\s+/);if(w.length<2)return null;
  var ans=w.pop(),key=strip(ans),d=[],tries=0;
  if(w.length>8)w=['…'].concat(w.slice(-8));
  while(d.length<2&&tries++<300){var c=pick(POOL),k=strip(c);if(k!==key&&d.every(function(x){return strip(x)!==k}))d.push(c)}
  return {kind:'blank',before:w.join(' '),ans:ans,opts:shuffle([ans].concat(d))};
}
function mcQ(q,ans,wrongs){return {kind:'mc',q:q,ans:ans,opts:shuffle([ans].concat(wrongs))}}

function buildQuiz(l){
  var qs=[];
  if(I.sec==='quran'){
    shuffle(l.ayat).forEach(function(a){if(qs.length<4){var q=blankQ(a);if(q)qs.push(q)}});
    var n=l.ayat.length,c=shuffle([n-2,n-1,n+1,n+2].filter(function(x){return x>=2})).slice(0,2);
    qs.push(mcQ('كَمْ عَدَدُ آيَاتِ '+l.title.replace('سُورَةُ','سُورَةِ')+'؟',ad(n),c.map(ad)));
  }else if(I.sec==='hadith'){
    var b=blankQ(l.text,l.text.length>120);if(b)qs.push(b);
    qs.push(mcQ('مَنْ رَاوِي هَذَا الْحَدِيثِ؟',l.narr,others(HADITH,function(h){return h.narr},l.narr,2)));
    qs.push(mcQ('مَاذَا يُعَلِّمُنَا هَذَا الْحَدِيثُ؟',l.short,others(HADITH,function(h){return h.short},l.short,2)));
  }else{
    l.qs.forEach(function(r){qs.push(mcQ(r[0],r[1],r.slice(2)))});
  }
  I.quiz={qs:qs,i:0,score:0,done:false,cur:{done:false,wrong:[],msg:''}};
}

var MEMCFG={mode:'solo',size:16};
function newMem(){
  var cfg=MEMCFG,es=shuffle(EMO.memory).slice(0,cfg.size/2);
  G.mem={mode:cfg.mode,size:cfg.size,cards:shuffle(es.concat(es)).map(function(e){return {e:e,up:false,ok:false}}),first:-1,lock:false,moves:0,turn:0,score:[0,0],won:false,known:{},plan:-1,gen:Math.random()};
}
function memNames(){var g=gt(),m=G.mem;return m.mode==='bot'?[g.you,g.robot]:[g.p1,g.p2]}
function memFinish(m){
  m.won=true;S.stats.mem++;var g=m.size===12?2:(m.size===16?3:5);
  if(m.mode==='solo')addStar(g);
  else if(m.mode==='duo')addStar(2);
  else addStar(m.score[0]>m.score[1]?g:1);
  save();checkBadges();
}
function memSee(m,i){if(m.mode==='bot'&&Math.random()<0.75)m.known[i]=true}
function memTurnEnd(m,matched){
  if(!matched&&m.mode!=='solo')m.turn=1-m.turn;
  m.lock=false;
  if(S.tab==='games'&&G.game==='memory'&&G.mem===m)renderView();
  if(m.mode==='bot'&&m.turn===1&&!m.won)robotPlay(m);
}
function memFlipCard(m,i){
  var c=m.cards[i];c.up=true;memSee(m,i);
  if(m.first<0){m.first=i;renderView();return}
  var j=m.first,a=m.cards[j];m.first=-1;m.moves++;
  if(a.e===c.e){
    a.ok=c.ok=true;m.score[m.turn]++;chime();delete m.known[i];delete m.known[j];
    if(m.cards.every(function(x){return x.ok}))memFinish(m);
    m.lock=true;renderView();setTimeout(function(){if(G.mem===m)memTurnEnd(m,true)},m.won?0:350);
  }else{
    m.lock=true;thud();renderView();
    setTimeout(function(){if(G.mem!==m)return;a.up=false;c.up=false;memTurnEnd(m,false)},900);
  }
}
function memFlip(i){
  var m=G.mem;if(!m||m.lock||m.won||(m.mode==='bot'&&m.turn===1))return;
  var c=m.cards[i];if(c.up||c.ok)return;memFlipCard(m,i);
}
function robotPlay(m){
  m.lock=true;
  setTimeout(function(){
    if(G.mem!==m||m.won)return;
    var free=[],by={},pair=null;
    m.cards.forEach(function(c,i){if(!c.ok&&!c.up)free.push(i)});
    Object.keys(m.known).forEach(function(k){var i=+k,c=m.cards[i];if(c&&!c.ok&&!c.up){(by[c.e]=by[c.e]||[]).push(i)}});
    Object.keys(by).forEach(function(e){if(!pair&&by[e].length>=2)pair=by[e]});
    var first=pair?pair[0]:pick(free.filter(function(i){return !m.known[i]}).concat(free.filter(function(i){return !m.known[i]}).length?[]:free));
    if(first===undefined)first=pick(free);
    memFlipCard(m,first);
    setTimeout(function(){
      if(G.mem!==m||m.won)return;
      var f=m.cards[first],second=-1;
      if(pair)second=pair[1];
      else{var kn=Object.keys(m.known).map(Number).filter(function(i){return i!==first&&!m.cards[i].ok&&!m.cards[i].up&&m.cards[i].e===f.e});if(kn.length)second=kn[0]}
      if(second<0){var rest=[];m.cards.forEach(function(c,i){if(i!==first&&!c.ok&&!c.up)rest.push(i)});
        var unk=rest.filter(function(i){return !m.known[i]});second=pick(unk.length?unk:rest)}
      memFlipCard(m,second);
    },850);
  },750);
}

/* scrambled letters */
function newSc(){
  var L=[];items().forEach(function(it,i){var w=it.w,n=Array.from(w).length;if(w.indexOf(' ')<0&&w.indexOf('-')<0&&n>=3&&n<=7)L.push(i)});
  var i;do{i=pick(L)}while(i===G.last.sc&&L.length>1);G.last.sc=i;
  var w=Array.from(items()[i].w),tiles=w.map(function(ch){return {ch:ch}}),sh=tiles,g=0;
  do{sh=shuffle(tiles)}while(sh.map(function(x){return x.ch}).join('')===w.join('')&&g++<20);
  G.sc={i:i,w:w,tiles:sh,placed:[],done:false,wrong:false,msg:''};hAdd('scramble',G.sc);
}
function scPick(k){
  var s=G.sc;if(!s||s.done||s.wrong||s.placed.indexOf(k)>=0)return;
  s.placed.push(k);
  if(s.placed.length===s.w.length){
    var guess=s.placed.map(function(x){return s.tiles[x].ch}).join('');
    if(guess===s.w.join('')){s.done=true;s.msg=pick(t().good);addStar(1);chime();speak(items()[s.i].w)}
    else{s.wrong=true;thud();renderView();
      setTimeout(function(){if(G.sc===s){s.placed=[];s.wrong=false;if(S.tab==='games'&&G.game==='scramble')renderView()}},800);return}
  }
  renderView();
}
function viewSc(){
  if(!G.sc||G.sc.i>=items().length)newSc();
  var s=G.sc,it=items()[s.i],g=gt();
  var slots=s.w.map(function(_,k){var p=s.placed[k];return '<span class="slot'+(p!==undefined?' f':'')+'">'+(p!==undefined?esc(s.tiles[p].ch):'')+'</span>'}).join('');
  var tiles=s.tiles.map(function(x,k){return '<button class="ltile" data-act="scpick" data-k="'+k+'"'+(s.placed.indexOf(k)>=0||s.done||s.wrong?' disabled':'')+'>'+esc(x.ch)+'</button>'}).join('');
  var fb=s.done?'<div class="fb good" aria-live="polite">'+esc(s.msg)+'<button class="btn" data-act="scnext"><span>'+esc(g.next)+'</span></button></div>'
    :(s.wrong?'<div class="fb bad" aria-live="polite">'+esc(t().retry)+'</div>':'<div class="fb"></div>');
  fb+=prevBtn('gprev','scramble');
  return '<div class="card"><h2>'+esc(g.askScramble)+'</h2><div class="em" aria-hidden="true">'+it.e+'</div>'+
   '<div class="slots" lang="'+S.lang+'">'+slots+'</div><div class="slots" lang="'+S.lang+'">'+tiles+'</div>'+
   '<div class="row center"><button class="btn ghost" data-act="scundo">'+esc(g.undo)+'</button><button class="btn ghost" data-act="scclear">'+esc(g.clear)+'</button><button class="btn ghost" data-act="schear">'+ICON.spk+'<span>'+esc(t().hear)+'</span></button></div>'+fb+'</div>';
}

/* odd one out */
function newOdd(){
  var keys=Object.keys(EMO.odd),a=pick(keys),b;do{b=pick(keys)}while(b===a);
  var three=shuffle(EMO.odd[a]).slice(0,3),one=pick(EMO.odd[b]);
  G.odd={opts:shuffle(three.concat([one])),ans:one,done:false,wrong:[],msg:''};hAdd('odd',G.odd);
}
function viewOdd(){

    return '<button class="'+cls+'" data-act="oopt" data-k="'+k+'"'+(o.done||o.wrong.indexOf(k)>=0?' disabled':'')+'><span aria-hidden="true">'+e+'</span></button>'}).join('');
  return '<div class="card"><h2>'+esc(g.askOdd)+'</h2><div class="opts" role="group">'+opts+'</div>'+fbHTML(o,'onext','odd')+'</div>';

/* what comes next */
function newNx(){
  var kind=rand(4),seq=[],ans,opts;
  if(kind<3){
    var pool=shuffle(EMO.pat),A=pool[0],B=pool[1],C=pool[2],D=pool[3];
    var pat=kind===0?[A,B]:(kind===1?[A,B,C]:[A,A,B]),full=[];
    for(var i=0;i<6;i++)full.push(pat[i%pat.length]);
    seq=full.slice(0,5);ans=full[5];opts=shuffle([A,B,C,D]);
  }else{
    var step=pick([1,2,3,5,10]),start=1+rand(5);
    for(var j=0;j<5;j++)seq.push(String(start+step*j));
    var a=start+step*5;ans=String(a);
    var cand=[];
    shuffle([-3,-2,-1,1,2,3,4,5,step,-step]).forEach(function(d){var x=a+d;if(x>=0&&x!==a&&cand.indexOf(x)<0&&seq.indexOf(String(x))<0)cand.push(x)});
    opts=shuffle([ans].concat(cand.slice(0,3).map(String)));
  }
  G.nx={seq:seq,ans:ans,opts:opts,done:false,wrong:[],msg:''};hAdd('next',G.nx);
}
function viewNx(){
  if(!G.nx)newNx();
  var o=G.nx,g=gt();
  var seq=o.seq.map(function(x){return '<span>'+x+'</span>'}).join('')+'<span class="qm">'+(o.done?o.ans:'?')+'</span>';
  var opts=o.opts.map(function(e,k){var cls='opt big'+(o.done&&e===o.ans?' ok':'')+(o.wrong.indexOf(k)>=0?' no':'');
    return '<button class="'+cls+'" data-act="nopt" data-k="'+k+'"'+(o.done||o.wrong.indexOf(k)>=0?' disabled':'')+' style="direction:ltr"><span aria-hidden="true">'+e+'</span></button>'}).join('');
  return '<div class="card"><h2>'+esc(g.askNext)+'</h2><div class="seq" dir="ltr">'+seq+'</div><div class="opts" role="group">'+opts+'</div>'+fbHTML(o,'nnext','next')+'</div>';
}

function gGo(dir){
  var k=G.game,o=dir<0?hPrev(k):hFwd(k);
  if(!o){if(dir<0)return;
    if(k==='riddle'||k==='quiz')newMC(k);else if(k==='scramble')newSc();else if(k==='odd')newOdd();else newNx();
  }else{if(k==='riddle'||k==='quiz')G.q=o;else if(k==='scramble')G.sc=o;else if(k==='odd')G.odd=o;else G.nx=o}

    case 'scclear':if(G.sc&&!G.sc.done&&!G.sc.wrong){G.sc.placed=[];renderView()}break;
    case 'schear':if(G.sc)speak(items()[G.sc.i].w);break;
    case 'oopt':if(G.odd)simplePick(G.odd,parseInt(b.dataset.k,10),G.odd.ans);break;
    case 'nopt':if(G.nx)simplePick(G.nx,parseInt(b.dataset.k,10),G.nx.ans);break;
  }
});
