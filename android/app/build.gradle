plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alifabc.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alifabc.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.0.5'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'alifdebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
